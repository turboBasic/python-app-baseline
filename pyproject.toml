[project]
name = "python-app-baseline"
version = "0.1.0"
description = "Rename before first release; add application dependencies to [project.dependencies]."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "typer>=0.15",
  "rich>=13.9",
  "pydantic>=2.10",
  "dynaconf>=3.2",
  "platformdirs>=4.11.2",
]

[project.scripts]
python-app-baseline = "python_app_baseline.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "ruff>=0.9",
  "pyright>=1.1.390",
  "pre-commit>=4.6.2",
  "commitizen>=4.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/python_app_baseline"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",     # pycodestyle errors
  "W",     # pycodestyle warnings
  "F",     # pyflakes
  "I",     # isort
  "UP",    # pyupgrade
  "B",     # flake8-bugbear
  "SIM",   # flake8-simplify
  "C4",    # flake8-comprehensions
  "RUF",   # ruff-specific
  "ASYNC", # flake8-async
]
ignore = ["E501"] # line length is the formatter's job

[tool.ruff.lint.isort]
known-first-party = ["python_app_baseline"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = ["-ra"]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "$version"
version_scheme = "pep440"
version_provider = "pep621"
