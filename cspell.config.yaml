version: "0.2"
language: en,en-GB
caseSensitive: false

dictionaryDefinitions:
  - name: project
    path: .cspell/project.txt
    description: names, tooling and identifiers specific to this repository
    addWords: true

dictionaries:
  - project
  - bash
  - companies
  - computing-acronyms
  - en-common-misspellings
  - filetypes
  - git
  - python
  - shellscript
  - softwareTerms
  - software-tools

ignorePaths:
  - .git/**
  - .cspell/**
  - .ruff_cache/**
  - .pytest_cache/**
  - "**/__pycache__/**"
  - "**/.venv/**"
  - uv.lock
  - "**/*.{png,svg,ico,db,sqlite3}"

ignoreRegExpList:
  - /\b[0-9a-f]{7,40}\b/ # git object hashes and pinned action SHAs
  - /(?<=https?:\/\/)\S+/ # URLs
  - /op:\/\/\S+/ # 1Password secret references

overrides:
  - filename: "**/*.py"
    dictionaries:
      - python
