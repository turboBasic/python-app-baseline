[tools]
python = "3.14"
uv = "latest"
"1password-cli" = "latest"
actionlint = "latest"
shellcheck = "latest"

[env]
_.python.venv = { path = ".venv", create = true }

[tasks.setup]
description = "Install dependencies and pre-commit hooks"
run = [
  "uv sync --locked",
  "uv run pre-commit install",
]

[tasks.fmt]
description = "Format code with ruff"
run = "uv run ruff format ."

[tasks.lint]
description = "Lint code with ruff and workflows with actionlint"
run = [
  "uv run ruff check .",
  "actionlint",
]

[tasks.typecheck]
description = "Type-check with pyright"
run = "uv run pyright"

[tasks.test]
description = "Run the test suite"
run = "uv run pytest"

[tasks.ci]
description = "Run everything CI runs, locally"
depends = ["lint", "typecheck", "test"]
