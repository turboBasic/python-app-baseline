# A squash merge takes its commit subject from the PR title, so the title has to
# be a valid Conventional Commit. ci.yml checks the commits themselves, which is
# what a rebase merge puts on main.

name: Semantic pull request

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  title:
    runs-on: ubuntu-latest
    steps:
      # Checks out nothing; reads the title from the event payload.
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
