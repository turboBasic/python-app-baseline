name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Concurrency belongs to the caller: a reusable workflow cannot set its caller's group.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  ci:
    uses: turboBasic/github-actions/.github/workflows/python-ci.yml@v2
    permissions:
      contents: read
