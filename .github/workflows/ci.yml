name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # cz check needs the full range, not just the tip
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
      - run: uv sync --locked
      # Only meaningful on rebase merges; a squash merge takes its subject from
      # the PR title, which the semantic-pr workflow checks instead.
      - name: Check commit messages
        if: github.event_name == 'pull_request'
        run: uv run cz check --rev-range ${{ github.event.pull_request.base.sha }}..HEAD
      - run: mise run lint
      - run: mise run typecheck
      - run: mise run test
